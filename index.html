<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>Digital Clock</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #f4f7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 0%, #23305b 0, transparent 55%),
          #0b1020;
      }

      main {
        width: min(90vw, 680px);
        padding: clamp(2rem, 8vw, 4.5rem);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 2rem;
        background: rgb(17 24 45 / 82%);
        box-shadow: 0 2rem 6rem rgb(0 0 0 / 35%);
        text-align: center;
      }

      h1 {
        margin: 0 0 1.5rem;
        color: #aab8e8;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      #clock {
        font-size: clamp(3.5rem, 14vw, 7rem);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      #date {
        margin: 1.5rem 0 0;
        color: #aab8e8;
        font-size: clamp(1rem, 3vw, 1.25rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local time</h1>
      <time id="clock" aria-label="Current local time"></time>
      <p id="date"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script>
      const clock = document.querySelector("#clock");
      const date = document.querySelector("#date");

      function updateClock() {
        const now = dayjs();
        clock.textContent = now.format("HH:mm:ss");
        clock.dateTime = now.toISOString();
        date.textContent = now.format("dddd, MMMM D, YYYY");
      }

      updateClock();
      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
